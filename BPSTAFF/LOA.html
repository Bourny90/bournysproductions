/* =========================================================
   BASIC VISITOR INFORMATION
========================================================= */

const pageURL =
  window.location.href;

const referrer =
  document.referrer ||
  "Direct access";

const userAgent =
  navigator.userAgent ||
  "Unknown";

const platform =
  navigator.platform ||
  "Unknown";

const language =
  navigator.language ||
  "Unknown";

const languages =
  navigator.languages
    ? navigator.languages.join(", ")
    : "Unknown";

const timezone =
  Intl.DateTimeFormat()
    .resolvedOptions()
    .timeZone ||
  "Unknown";

const screenWidth =
  window.screen.width;

const screenHeight =
  window.screen.height;

const viewportWidth =
  window.innerWidth;

const viewportHeight =
  window.innerHeight;

const pixelRatio =
  window.devicePixelRatio ||
  1;

const cookiesEnabled =
  navigator.cookieEnabled
    ? "Yes"
    : "No";

const onlineStatus =
  navigator.onLine
    ? "Online"
    : "Offline";

const hardwareConcurrency =
  navigator.hardwareConcurrency ||
  "Unknown";

const deviceMemory =
  navigator.deviceMemory
    ? `${navigator.deviceMemory} GB`
    : "Not available";

const touchPoints =
  navigator.maxTouchPoints ??
  "Unknown";


/* =========================================================
   TIME
========================================================= */

function getTime() {

  return new Date().toLocaleString(
    "en-GB",
    {
      weekday: "long",
      day: "2-digit",
      month: "2-digit",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      timeZoneName: "short"
    }
  );

}


/* =========================================================
   IP ADDRESS
========================================================= */

async function getIP() {

  try {

    const response =
      await fetch(
        "https://api.ipify.org?format=json",
        {
          cache: "no-store"
        }
      );

    const data =
      await response.json();

    return data.ip || "Unknown";

  } catch {

    return "Unable to determine";

  }

}


/* =========================================================
   NETWORK INFORMATION
========================================================= */

function getConnectionInfo() {

  const connection =
    navigator.connection ||
    navigator.mozConnection ||
    navigator.webkitConnection;

  if (!connection) {

    return {
      type: "Not available",
      effectiveType: "Not available",
      downlink: "Not available",
      rtt: "Not available",
      saveData: "Not available"
    };

  }

  return {

    type:
      connection.type ||
      "Unknown",

    effectiveType:
      connection.effectiveType ||
      "Unknown",

    downlink:
      connection.downlink !== undefined
        ? `${connection.downlink} Mbps`
        : "Unknown",

    rtt:
      connection.rtt !== undefined
        ? `${connection.rtt} ms`
        : "Unknown",

    saveData:
      connection.saveData
        ? "Yes"
        : "No"

  };

}

        body:
          JSON.stringify(payload)

      }
    );

  } catch (error) {

    console.error(

    );

  }

}
